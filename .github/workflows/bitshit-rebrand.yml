name: BitShit Build and Rebrand Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'rebrand/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitshit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  verify-rebrand:
    name: Verify installers and product identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate shell syntax
        run: bash -n install.sh scripts/verify-bitshit-rebrand.sh scripts/audit-bitshit-public-brand.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Verify BitShit rebrand invariants
        run: bash scripts/verify-bitshit-rebrand.sh

      - name: Audit public CLI identity
        run: bash scripts/audit-bitshit-public-brand.sh

  cargo-metadata:
    name: Cargo metadata (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Verify public binary target
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          grep -q '"name":"bitshit"' cargo-metadata.json

  cpu-build:
    name: CPU-only release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GGML_CUDA: 'OFF'
      GGML_HIPBLAS: 'OFF'
      GGML_METAL: 'OFF'
      BITSHIT_HOME: ${{ github.workspace }}/.ci-bitshit
      CLUAIZ_HOME: ${{ github.workspace }}/.ci-bitshit
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bitshit-cpu

      - name: Build BitShit CPU binary
        run: cargo build --locked --release -p cmd --bin bitshit

      - name: Verify binary exists
        run: test -x target/release/bitshit

  backend-contracts:
    name: Backend contract (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            expected: 'GGML_CUDA=OFF GGML_HIPBLAS=OFF GGML_METAL=OFF'
          - backend: cuda
            expected: 'GGML_CUDA=ON'
          - backend: rocm
            expected: 'GGML_HIPBLAS=ON'
          - backend: metal
            expected: 'GGML_METAL=ON'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify installer exposes backend
        shell: bash
        run: |
          grep -q "${{ matrix.backend }}" install.sh
          grep -q "${{ matrix.expected }}" install.sh

      - name: Explain hardware build boundary
        run: |
          echo "${{ matrix.backend }} contract verified."
          echo "Vendor-backed compilation requires a matching self-hosted runner and SDK."
