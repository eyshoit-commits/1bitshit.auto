[package]
name = "llama"
version = "0.1.0"
edition = "2021"
authors = ["Cluaiz Technologies"]
build = "build.rs"

[lib]
name = "cluaiz_llama"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# ── Sovereign LLaMA Backend (Direct C++ Bridge) ──
anyhow = "1.0"
tracing = "0.1"
cluaiz-shared = { path = "../../Inference-engine/engines/cluaiz-shared" }
tokenizers = "0.22.2"
libloading = "0.8"
tokio = { version = "1.37", features = ["full"] }
neural-core = { path = "../neural_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[build-dependencies]
cc = "1.0"
bindgen = "0.69"
cmake = "0.1"

[features]
# Backends are selected explicitly by the platform installer.
default = []

# High-Performance GPUs
cuda = []
metal = []
vulkan = []
rocm = []

# NPU & Specialized Hardware
openvino = []
qnn = []
sycl = []
cann = []
arm_neon = []

[[bin]]
name = "test_llama"
path = "src/bin/test_llama.rs"
